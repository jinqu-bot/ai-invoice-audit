# 演示环境 nginx 配置：80 → 前端 3100，/api/ → 后端 8000
#
# 这是「只有 IP」的基础版，bootstrap.sh 用它保证全新机器先能跑起来。
# 已配好域名 + HTTPS（https://shenpiaobao.xyz）的完整版本见 deploy/nginx-domain.conf，
# 区别：多了域名 80→301 和 443 两块，IP 80 兜底保持不变。证书需先 certbot 签发。
#
# 为什么需要 nginx，而不是让前端直接开 80：
# 1) 前端页面里写的是相对路径 /api/*，没有 nginx 就没人转发；
# 2) 浏览器拿到的 origin 只有一个（http://8.217.202.172），不涉及跨域；
# 3) SSE 必须关掉代理缓冲，否则"实时进度"会被攒成一坨最后一起吐出来。
#    这是本次部署最容易翻车的点，proxy_buffering off 那行别删。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 一张手机拍的发票 2-4MB，压完更小；留 30m 够用，也防一手超大文件
    client_max_body_size 30m;

    # 访问日志留着，验收时能看出评委点了什么
    access_log /var/log/nginx/ai-audit.access.log;
    error_log  /var/log/nginx/ai-audit.error.log warn;

    # ---------------- 后端接口 ----------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE（/api/batches/{id}/stream）三件套：不缓冲、不缓存、超时给足
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---------------- 前端页面 ----------------
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
