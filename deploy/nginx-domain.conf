# 演示环境 nginx：IP 80 兜底 + 域名 80 → 443 + 域名 443 反代
#
# 证书：Let's Encrypt，/etc/letsencrypt/live/shenpiaobao.xyz/
# 签发：certbot certonly --nginx -d shenpiaobao.xyz -d www.shenpiaobao.xyz
# 续期：certbot.timer（systemd）自动续，证书 90 天有效
#
# 铁律：server_name _ 的 IP 直连必须保留。
# Let's Encrypt 签不了 IP 地址，若把 IP 也 301 到 https，会变成证书域名不匹配的红色警告页。
# 域名块里 SSE 的 proxy_buffering off 三行同样不能漏，否则实时进度会被攒成一坨。

# ---------------- ① IP 直连兜底（永远保留） ----------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 一张手机拍的发票 2-4MB，压完更小；留 30m 够用，也防一手超大文件
    client_max_body_size 30m;

    # 访问日志留着，验收时能看出评委点了什么
    access_log /var/log/nginx/ai-audit.access.log;
    error_log  /var/log/nginx/ai-audit.error.log warn;

    # ---------------- 后端接口 ----------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE（/api/batches/{id}/stream）三件套：不缓冲、不缓存、超时给足
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 上传接口单独限得更紧：每张票都要调视觉模型，最贵
    location = /api/batches {
        limit_req zone=upload burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/batches;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 30m;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------------- ② 域名 HTTP → HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name shenpiaobao.xyz www.shenpiaobao.xyz;

    # Let's Encrypt HTTP-01 续期需要能访问 /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- ③ 域名 HTTPS（真正干活） ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shenpiaobao.xyz www.shenpiaobao.xyz;

    ssl_certificate     /etc/letsencrypt/live/shenpiaobao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shenpiaobao.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 30m;
    access_log /var/log/nginx/ai-audit.access.log;
    error_log  /var/log/nginx/ai-audit.error.log warn;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # SSE 三件套，和 IP 块保持一致
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /api/batches {
        limit_req zone=upload burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/batches;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 30m;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
